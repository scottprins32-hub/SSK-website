<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSK Europe · Versie 04 · Rustig</title>
<script>
/* Theme before first paint: "licht", "donker" or the standard look (no attribute). */
document.documentElement.classList.add('js'); /* lets the intro states apply before the first paint */
try { var t = localStorage.getItem('ssk-theme'); if (t === 'licht' || t === 'donker') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="preload" href="../assets/fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts are hosted with the site (latin subset), so no request leaves for Google before the first paint. */
@font-face{font-family:'Archivo Wide';font-style:normal;font-weight:900;font-display:swap;src:url(../assets/fonts/archivo-wide-900.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(../assets/fonts/barlow-condensed-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(../assets/fonts/barlow-condensed-800.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(../assets/fonts/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(../assets/fonts/barlow-500.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(../assets/fonts/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(../assets/fonts/barlow-700.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(../assets/fonts/ibm-plex-mono-400.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(../assets/fonts/ibm-plex-mono-600.woff2) format('woff2')}
/* SSK Europe design system: tokens + components. Shared by all five versions. */
:root{
  /* SSK brand: black, red, white. (Token names kept from the design system; "navy" now holds the black scale.) */
  --navy-950:#000000;--navy-900:#0A0A0A;--navy-800:#1A1A1A;--navy-700:#2A2A2A;--navy-600:#0A0A0A;--navy-500:#555555;--navy-100:#D4D4D4;--navy-50:#F2F2F2;
  --red-700:#A00D24;--red-600:#C8102E;--red-50:#FCEEF0;
  --tan-600:#C8102E;--tan-500:#C8102E;--tan-200:#FF4B5F;--tan-100:#FCEEF0;
  --chalk:#F5F5F5;--white:#fff;
  --g900:#111111;--g700:#333333;--g600:#555555;--g500:#737373;--g400:#9A9A9A;--g300:#C4C4C4;--g200:#E0E0E0;--g100:#EDEDED;--g50:#F7F7F7;
  --ok:#0A0A0A;--ok-bg:#F2F2F2;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  --r1:3px;--r2:6px;--r3:10px;
  --sh-card:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.06);
  --sh-raised:0 4px 16px rgba(0,0,0,.12);
  --sh-overlay:0 12px 40px rgba(0,0,0,.22);
  --focus:0 0 0 3px rgba(200,16,46,.35);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{background:var(--chalk);color:var(--g700);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r1)}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.ico{width:100%;height:100%}
.ui{width:20px;height:20px;flex:none}

/* type */
.d-xl,.d-lg,.d-md,.d-sm,.kick,.caps{font-family:var(--display);text-transform:uppercase;color:var(--navy-900)}
.d-xl{font-weight:800;font-size:clamp(40px,6vw,64px);line-height:1.02;letter-spacing:.01em}
.d-lg{font-weight:800;font-size:clamp(32px,4.2vw,44px);line-height:1.05;letter-spacing:.01em}
.d-md{font-weight:700;font-size:clamp(26px,3vw,32px);line-height:1.05;letter-spacing:.01em}
.d-sm{font-weight:700;font-size:24px;line-height:1.05;letter-spacing:.01em}
.kick{font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--red-600)}
.caps{font-weight:700;letter-spacing:.08em}
.lead{font-size:17px;color:var(--g700);max-width:56ch}
.muted{color:var(--g500)}
.mono{font-family:var(--mono);font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:var(--r1);font:700 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:background-color .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.btn.sm{height:40px;padding:0 16px;font-size:15px}
.btn-red{background:var(--red-600);color:#fff}.btn-red:hover{background:var(--red-700)}
.btn-navy{background:var(--navy-900);color:#fff}.btn-navy:hover{background:var(--navy-950)}
.btn-line{border:1px solid var(--g300);color:var(--navy-900);background:#fff}.btn-line:hover{border-color:var(--navy-900)}
.btn-ghost{border:1px solid rgba(255,255,255,.4);color:#fff}.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.06)}
.link{font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--navy-600);display:inline-flex;align-items:center;gap:6px}
.link:hover{color:var(--red-600)}
.link .ui{width:16px;height:16px}

/* badges */
.badge{display:inline-block;padding:3px 8px;border-radius:var(--r1);font:700 12px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase}
.b-sale{background:var(--red-600);color:#fff}
.b-new{background:var(--navy-900);color:#fff}
.b-ok{background:var(--ok-bg);color:var(--ok)}

/* stitch motif: once per view */
.stitch{height:0;border-top:3px dashed var(--red-600)}

/* top bar + header */
.topbar{background:var(--navy-950);color:var(--navy-100);font-size:13px}
.topbar .wrap{display:flex;gap:24px;justify-content:center;align-items:center;height:36px}
.topbar span{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.topbar .ui{width:16px;height:16px;color:var(--navy-100)}
.hdr{position:sticky;top:0;z-index:50;background:var(--navy-900);color:#fff}
.hdr .bar{display:flex;align-items:center;gap:24px;height:72px}
.logo{display:flex;align-items:baseline;gap:6px;font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:1;white-space:nowrap}
.logo b{font-size:32px;letter-spacing:.02em}
.logo i{font-style:normal;font-size:16px;letter-spacing:.14em}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:var(--r1);background:#fff;color:var(--g700)}
.search input{flex:1;border:0;outline:0;background:none;min-width:0;font-size:15px}
.search input:focus-visible{box-shadow:none}
.search input::-webkit-search-cancel-button{cursor:pointer}
.search .ui{color:var(--g500)}
.search .go{display:grid;place-items:center;width:28px;height:28px;margin-right:-6px;border-radius:var(--r1);background:var(--red-600);color:#fff;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s}
.search .go .ui{width:16px;height:16px}
.search.open{border-radius:var(--r1) var(--r1) 0 0}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:90;max-height:min(70vh,560px);overflow:auto;background:#fff;color:var(--g700);border-radius:0 0 var(--r2) var(--r2);box-shadow:var(--sh-overlay);padding:8px;border-top:1px solid var(--g100);animation:sg .18s var(--ease)}
@keyframes sg{from{opacity:0;transform:translateY(-4px)}}
.sugg[hidden]{display:none}
.sg-h{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--g500);padding:10px 8px 6px}
.sugg a{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--r1);color:var(--g900)}
.sugg a:hover,.sugg a[aria-selected=true]{background:var(--g50)}
.sugg a[aria-selected=true]{box-shadow:inset 3px 0 0 var(--red-600)}
.sugg mark{background:none;color:var(--red-600);font-weight:700}
.sg-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 6px}
.sugg .sg-chip{display:inline-flex;padding:7px 12px;border:1px solid var(--g200);font:700 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.sugg .sg-chip:hover,.sugg .sg-chip[aria-selected=true]{background:var(--navy-900);color:#fff;border-color:var(--navy-900);box-shadow:none}
.sg-cz .ui{color:var(--red-600)}
.sg-cz b,.sg-cat span{display:block;font:700 15px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.sg-cz small{font-size:13px;color:var(--g500)}
.sg-cat svg{width:26px;height:26px;flex:none;color:var(--navy-900)}
.sg-im{width:52px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--g100);border-radius:var(--r1);background:#fff;overflow:hidden}
.sg-im img{width:100%;height:100%;object-fit:contain}
.sg-im svg{width:24px;height:24px;color:var(--g400)}
.sg-tx{flex:1;min-width:0}
.sg-tx small{display:block;font:700 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--g500)}
.sg-tx b{display:block;margin-top:3px;font-weight:600;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-pr{font:600 13px/1 var(--mono);color:var(--navy-900);white-space:nowrap}
.sg-pr.sale{color:var(--red-600)}
.sg-none{padding:10px 8px;font-size:14px;color:var(--g500)}
.sugg .sg-all{margin-top:6px;border-top:1px solid var(--g100);border-radius:0;padding-top:12px;font-weight:600;font-size:14px}
.sg-all span{flex:1}
.sg-all .ui{width:18px;height:18px;color:var(--g500)}
.search:focus-within .go,.search input[type=search]:not(:placeholder-shown)~.go{opacity:1;transform:none}
.hdr .acts{margin-left:auto;display:flex;gap:4px}
.hdr .acts a,.hdr .burger{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:var(--r1);font:600 14px/1 var(--body);position:relative}
.hdr .acts a:hover,.hdr .burger:hover{background:var(--navy-800)}
.cnt{position:absolute;top:3px;left:20px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--red-600);color:#fff;font:600 10px/16px var(--body);text-align:center}
.hdr .burger{display:none;color:#fff}
.nav{border-top:1px solid var(--navy-800)}
.nav>.wrap{display:flex;align-items:center;gap:2px;height:48px}
.nav>.wrap>a{font:700 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--navy-100);padding:0 12px;height:48px;display:flex;align-items:center;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s var(--ease)}
.nav>.wrap>a:hover{color:#fff;border-bottom-color:var(--red-600)}
.nav>.wrap>.all{display:flex;align-items:center;gap:8px;color:#fff;padding-left:0}
.nav .cz{margin-left:auto;color:#fff}
.nav .cz .ui{width:16px;height:16px;margin-right:6px}
.mega{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;color:var(--g700);box-shadow:var(--sh-overlay);border-top:1px solid var(--g200)}
.mega.open{display:block}
.mega .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 24px;padding-top:24px;padding-bottom:24px}
.mega a{display:flex;gap:12px;align-items:center;padding:8px;border-radius:var(--r1)}
.mega a:hover{background:var(--g50)}
.mega a svg{width:32px;height:32px;flex:none;color:var(--navy-900)}
.mega b{display:block;font:700 15px/1.1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--navy-900)}
.mega small{font-size:13px;color:var(--g500)}

/* light header variant */
.hdr.light{background:#fff;color:var(--navy-900);border-bottom:1px solid var(--g200)}
.hdr.light .logo{color:var(--navy-900)}
.hdr.light .search{background:var(--g50);border:1px solid var(--g200)}
.hdr.light .acts a:hover,.hdr.light .burger:hover{background:var(--g50)}
.hdr.light .burger{color:var(--navy-900)}
.hdr.light .nav{border-top-color:var(--g200)}
.hdr.light .nav>.wrap>a{color:var(--g600)}
.hdr.light .nav>.wrap>a:hover,.hdr.light .nav .all,.hdr.light .nav .cz{color:var(--navy-900)}
.hdr.light .nav .cz{color:var(--red-600)}

/* drawer (mobile) */
.drawer{position:fixed;inset:0;z-index:80;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.drawer .dpanel{position:absolute;top:0;left:0;bottom:0;width:min(340px,88vw);background:#fff;overflow:auto;box-shadow:var(--sh-overlay);padding:16px}
.drawer .dpanel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.drawer .dpanel a.c{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--g100);font:700 16px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--navy-900)}
.drawer .dpanel a.c svg{width:24px;height:24px}

/* sections */
.sec{padding:64px 0}
.sec.tight{padding:48px 0}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}
.sec-h p{margin-top:8px;color:var(--g600)}

/* cards */
.card{background:#fff;border:1px solid var(--g200);border-radius:var(--r2);box-shadow:var(--sh-card)}
.lift{transition:box-shadow .18s var(--ease),transform .18s var(--ease)}
.lift:hover{box-shadow:var(--sh-raised);transform:translateY(-2px)}

/* product card */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pc{display:flex;flex-direction:column;overflow:hidden}
.pc .ph{position:relative;aspect-ratio:4/3;background:#fff;border-bottom:1px solid var(--g100)}
.pc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;background:#fff}
.pc .badge{position:absolute;top:12px;left:12px;z-index:2}
.pc .info{padding:16px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc .brand{font:700 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--g500)}
.pc .name{font-weight:600;color:var(--g900);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pc .price{margin-top:auto;padding-top:8px;display:flex;align-items:baseline;gap:8px;font-family:var(--mono)}
.pc .price b{font-size:16px;font-weight:600;color:var(--navy-900)}
.pc .price s{font-size:13px;color:var(--g500)}
.pc .price.sale b{color:var(--red-600)}
.pc .stock{font-size:13px;color:var(--ok);display:flex;align-items:center;gap:6px}
.pc .stock:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}

/* placeholder (missing photo) */
.phd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--g100);color:var(--g500)}
.phd svg{width:44px;height:44px;color:var(--g400)}
.phd span{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:20px;min-height:148px}
.cat svg{width:40px;height:40px;color:var(--navy-900)}
.cat b{font:700 18px/1.05 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--navy-900);margin-top:auto}
.cat small{font-size:13px;color:var(--g500);line-height:1.4}
.cat.all{background:var(--navy-900);border-color:var(--navy-900)}
.cat.all svg,.cat.all b{color:#fff}.cat.all small{color:var(--navy-100)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--g200);background:#fff;border-radius:var(--r1);font:700 14px/1 var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--navy-900);transition:border-color .15s var(--ease)}
.chip:hover{border-color:var(--navy-900)}
.chip svg{width:20px;height:20px}

/* USP strip */
.usp{background:#fff;border-bottom:1px solid var(--g200)}
.usp .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.usp .wrap>div{display:flex;gap:12px;align-items:center;padding:16px 16px 16px 0}
.usp svg{width:28px;height:28px;flex:none;color:var(--navy-900)}
.usp b{display:block;font:700 15px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--navy-900)}
.usp small{font-size:13px;color:var(--g500)}

/* customiser band */
.cz-band{background:var(--navy-900);color:var(--navy-100);border-radius:var(--r2);overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr}
.cz-band .tx{padding:48px;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.cz-band .tx .d-lg{color:#fff}
.cz-band .tx p{max-width:46ch;font-size:17px}
.cz-band .steps{display:flex;flex-wrap:wrap;gap:8px 20px;font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#fff;margin:4px 0 8px}
.cz-band .steps span{display:flex;align-items:center;gap:8px}
.cz-band .steps i{font-style:normal;font-family:var(--mono);font-size:12px;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--navy-500);border-radius:var(--r1);color:var(--navy-100)}
.cz-band .vis{position:relative;background:var(--navy-800);min-height:280px}
.cz-band .vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:24px}
.cz-band .vis .phd{background:var(--navy-800);color:var(--navy-100)}
.cz-band .vis .phd svg{color:var(--navy-500)}

/* promo panel (club, HHS) */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{padding:32px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.panel .d-md{margin-bottom:4px}
.panel ul{list-style:none;display:grid;gap:8px;margin:4px 0 8px;width:100%}
.panel li{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--g100);padding-bottom:8px;font-size:14px}
.panel li .mono{color:var(--navy-900);white-space:nowrap}
.panel.navy{background:var(--navy-900);border-color:var(--navy-900);color:var(--navy-100)}
.panel.navy .d-md{color:#fff}
.panel.navy .kick{color:var(--tan-200)}

/* brands */
.brands{display:grid;grid-template-columns:repeat(8,1fr);border:1px solid var(--g200);border-radius:var(--r2);background:#fff;overflow:hidden}
.brands>*{display:grid;place-items:center;height:72px;border-right:1px solid var(--g200);font:800 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--g500);text-align:center;padding:0 8px;transition:color .15s var(--ease)}
.brands>*:last-child{border-right:0}
.brands>*:hover{color:var(--navy-900);background:var(--g50)}

/* showroom */
.show{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px}
.show .card{padding:24px}
.hours{list-style:none;display:grid;gap:6px;margin-top:12px}
.hours li{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid var(--g100);padding-bottom:6px}
.hours li .mono{color:var(--navy-900)}
.hours li.closed .mono{color:var(--g400)}
.hours li.today{font-weight:600}
.hours li.today .mono{color:var(--ok)}
.addr{display:grid;gap:10px;margin-top:12px;font-size:15px}
.addr a,.addr span{display:flex;gap:10px;align-items:center}
.addr .ui{color:var(--g600)}
.addr a:hover{color:var(--navy-600)}

/* footer */
.ftr{background:var(--navy-900);color:var(--navy-100);margin-top:64px}
.ftr .top{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.1fr 1fr;gap:32px;padding:56px 0 40px}
.ftr .fh{max-width:320px}

<style>
/* Loaded last on every page (build.py puts it at the end of <head>).
   1. Product photos on a lit stage, for every theme.
   2. The theme picker in the header.
   3. Licht: the whole site light.   4. Donker: the whole site dark.
   The standard look is the page's own styles, with no data-theme on <html>. */

/* ---------- 1. product photos pop ---------- */
/* Every photo sits on a soft studio spotlight with a contact shadow underneath. White photo backgrounds
   melt into the light (multiply), colours get a little more life, and on hover the product lifts. */
.pc .ph{background:radial-gradient(115% 95% at 50% 36%,#fff 0,#fff 40%,#E9EAEC 100%)}
.pc .ph:before{content:'';position:absolute;left:20%;right:20%;bottom:6%;height:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.24),rgba(0,0,0,0));z-index:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s}
.pc .ph img{z-index:1;background:transparent!important;mix-blend-mode:multiply;filter:saturate(1.18) contrast(1.05);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .45s ease}
.pc:hover .ph img{transform:translateY(-7px) scale(1.07)}
.pc:hover .ph:before{transform:scaleX(.8);opacity:.6}
.pc .badge{z-index:3}
.pc .phd{background:transparent}
.bt{background:radial-gradient(520px circle at var(--mx) var(--my),rgba(200,16,46,var(--sp,0)),transparent 55%),radial-gradient(110% 90% at 50% 34%,#fff 0,#fff 38%,#E9EAEC 100%)}
.bt-img:before{content:'';position:absolute;left:28%;right:28%;bottom:66px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.2),rgba(0,0,0,0));transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s}
.bt.big .bt-img:before{bottom:78px;height:34px}
.bt .bt-img img{filter:saturate(1.18) contrast(1.05)}
.bt:hover .bt-img img{transform:translateY(-8px) scale(1.06) rotate(-2deg)}
.bt:hover .bt-img:before{transform:scaleX(.78);opacity:.6}
.hx-float img.on{filter:blur(0) drop-shadow(0 30px 40px rgba(0,0,0,.55)) saturate(1.15) contrast(1.04)}
.hx-thumbs img{filter:saturate(1.15)}
.ch-vis img{background:radial-gradient(115% 95% at 50% 36%,#fff 0,#fff 40%,#E9EAEC 100%);filter:saturate(1.15) contrast(1.04)}
.sg-im img{mix-blend-mode:multiply;filter:saturate(1.15)}

/* ---------- 2. theme picker ---------- */
.theme{display:flex;gap:2px;margin-left:auto;padding:3px;border:1px solid rgba(255,255,255,.18);border-radius:99px}
.theme button{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--g400);transition:background-color .2s var(--ease),color .2s var(--ease)}
.theme button .ui{width:16px;height:16px}
.theme button:hover{color:#fff}
.theme button[aria-pressed=true]{background:#fff;color:#000}
.hdr .theme+.acts{margin-left:8px}
html.theme-vt::view-transition-old(root),html.theme-vt::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}
@media (max-width:600px){
  .theme{--cycle:1;padding:0;border:0;margin-left:auto}
  .theme button:not([aria-pressed=true]){display:none}
  .theme button[aria-pressed=true]{width:40px;height:40px;background:none;color:inherit}
}

    const h = S.HOURS.map(([a, b], i) => `<li class="${b === 'Gesloten' ? 'closed' : ''}${i === d ? ' today' : ''}"><span>${a}${i === d ? ' (vandaag)' : ''}</span><span class="mono">${b}</span></li>`).join('');
    const c = S.CONTACT;
    return `<div class="show">
      <div class="card"><div class="kick">Showroom</div><h2 class="d-md" style="margin-top:6px">Kom langs in Kwintsheul</h2>
        <p style="margin-top:8px">Handschoenen moet je passen. In de showroom van het ${c.name} vind je de complete collectie.</p>
        <span class="open-now${o.open ? ' yes' : ''}">${o.text}</span>
        <div class="addr"><a href="${S.SHOP.maps}" target="_blank" rel="noopener">${ui('pin')}${c.street}, ${c.city}</a><a href="tel:${c.phone.replace(/\s/g, '')}">${ui('phone')}${c.phone}</a><a href="mailto:${c.email}">${ui('mail')}${c.email}</a></div>
        <div class="btns"><a class="btn btn-navy sm" href="${S.SHOP.maps}" target="_blank" rel="noopener">Route plannen</a><a class="btn btn-line sm" href="tel:${c.phone.replace(/\s/g, '')}">Bel ons</a></div></div>
      <div class="card"><div class="kick">${ui('clock', 'ui')} Openingstijden</div><ul class="hours">${h}</ul></div>
      <div class="card"><div class="kick">Klantenservice</div><ul class="hours">${['Maten', 'Retour Zenden', 'Garantie', 'Welke Bal Koopt U?', 'Was Voorschrift', 'Levertijden'].map(t => `<li><a href="${S.PAGE[t]}">${t}</a><span class="ui" style="color:var(--g400)">${ui('arrow')}</span></li>`).join('')}</ul></div>
    </div>`;
  }

  function footer() {
    const c = S.CONTACT;
    const half = Math.ceil(S.PAGES.length / 2);
    const li = a => a.map(([p, u]) => `<li><a href="${S.BASE + u}">${p}</a></li>`).join('');
    return `<footer class="ftr"><div class="wrap">
      <div class="top">
        <div><a class="logo" href="./"><b>SSK</b><i>Europe</i></a><p style="max-width:32ch">${c.name}. Honkbal en softbal voor spelers, teams en verenigingen.</p>
          <div class="soc"><a href="${c.instagram}" aria-label="Instagram">${ui('ig')}</a><a href="${c.facebook}" aria-label="Facebook">${ui('fb')}</a></div></div>
        <div><h4>Klantenservice</h4><ul>${li(S.PAGES.slice(0, half))}</ul></div>
        <div><h4>Informatie</h4><ul>${li(S.PAGES.slice(half))}</ul></div>
        <div><h4>Openingstijden</h4><ul class="fh">${S.HOURS.map(([d, t]) => `<li><span>${d}</span><span>${t}</span></li>`).join('')}</ul></div>
        <div><h4>Contact</h4><ul><li>${c.street}</li><li>${c.city}</li><li><a href="tel:${c.phone.replace(/\s/g, '')}">${c.phone}</a></li><li><a href="mailto:${c.email}">${c.email}</a></li></ul></div>
      </div>
      <div class="bot"><span>© 2026 SSK Europe</span><span>${c.street}, ${c.city}</span></div>
    </div></footer>`;
  }

  // Wire up: menu, mega menu.
  // Light, standard and dark. The choice is kept per visitor; head.html applies it before the first paint.
  const THEMES = ['licht', 'std', 'donker'];
  const curTheme = () => document.documentElement.getAttribute('data-theme') || 'std';
  function markTheme() {
    const t = curTheme();
    document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === t));
    const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'licht' ? '#ffffff' : '#000000';
  }
  function setTheme(t, from) {
    const apply = () => {
      if (t === 'std') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('ssk-theme', t); } catch (e) {}
      markTheme();
    };
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!document.startViewTransition || reduce || !from) return apply();
    // A circle grows out of the button that was pressed and reveals the new theme.
    const r = from.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    const root = document.documentElement; root.classList.add('theme-vt');
    const vt = document.startViewTransition(apply);
    vt.finished.finally(() => root.classList.remove('theme-vt'));
    vt.ready.then(() => {
      document.documentElement.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
        { duration: 650, easing: 'cubic-bezier(.65,0,.25,1)', pseudoElement: '::view-transition-new(root)' });
    }).catch(() => {});
  }

  function wire() {
    markTheme();
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-theme-set]'); if (!b) return;
      // On phones only one button shows: it steps to the next theme.
      const t = getComputedStyle(b.parentNode).getPropertyValue('--cycle').trim() === '1' ? THEMES[(THEMES.indexOf(curTheme()) + 1) % 3] : b.dataset.themeSet;
      setTheme(t, b);
    });
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-open],[data-close]');
      if (!t) { if (!e.target.closest('.mega')) document.querySelectorAll('.mega.open').forEach(m => m.classList.remove('open')); return; }
      if (t.dataset.open === 'drawer') document.querySelector('.drawer').classList.add('open');
      else if (t.dataset.open === 'mega') { e.preventDefault(); const m = document.querySelector('.mega'); if (window.innerWidth <= 900) document.querySelector('.drawer').classList.add('open'); else { m.classList.toggle('open'); if (m.classList.contains('open')) scrollTo({ top: 0 }); } }
      else if (t.hasAttribute('data-close')) document.querySelector('.drawer').classList.remove('open');
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.querySelector('.drawer')?.classList.remove('open'); document.querySelector('.mega')?.classList.remove('open'); } });
  }
  // Instant search: products and categories from data.js as you type; Enter on free text searches the shop.
  function search() {
    const form = document.querySelector('[data-search]'); if (!form) return;
    const inp = form.querySelector('input[type=search]'), box = form.querySelector('.sugg');
    const seen = new Set(), items = [];
    Object.values(S.PRODUCTS).flat().forEach(p => { if (!seen.has(p.url)) { seen.add(p.url); items.push(p); } });
    const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9.]+/g, ' ');
    const hay = items.map(p => norm(p.brand + ' ' + p.name));
    const POP = ['Handschoenen', 'Knuppels', 'Ballen', 'Helmen', 'Outlet'];
    let opts = [], act = -1;
    const mark = (t, q) => { let h = esc(t); q.forEach(w => { if (w) h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); }); return h; };
    function render() {
      const raw = inp.value.trim(), q = norm(raw).split(' ').filter(Boolean);
      let html = '';
      if (!q.length) {
        html = `<div class="sg-h">Populair</div><div class="sg-chips">${POP.map(n => `<a role="option" class="sg-chip" href="${nav(n).url}">${n}</a>`).join('')}</div>
          <div class="sg-h">Merken</div><div class="sg-chips">${S.BRANDS.map(b => `<a role="option" class="sg-chip" href="${S.brandUrl(b)}">${b}</a>`).join('')}</div>
          <a role="option" class="sg-cz" href="${CZ}">${ui('pen')}<span><b>Glove Customizer</b><small>Ontwerp je eigen handschoen</small></span></a>`;
      } else {
        const cats = S.NAV.filter(n => q.every(w => norm(n.name + ' ' + n.sub).includes(w))).slice(0, 3);
        const prods = items.filter((p, i) => q.every(w => hay[i].includes(w))).slice(0, 6);
        if (cats.length) html += `<div class="sg-h">Categorieën</div>` + cats.map(n => `<a role="option" class="sg-cat" href="${n.url}">${ic(n.icon)}<span>${mark(n.name, q)}</span></a>`).join('');
        if (prods.length) html += `<div class="sg-h">Producten</div>` + prods.map(p => `<a role="option" class="sg-p" href="${p.url}"><span class="sg-im">${p.photo ? `<img src="${p.photo}" alt="" loading="lazy" onerror="this.remove()">` : ic(p.icon)}</span><span class="sg-tx"><small>${p.brand}</small><b>${mark(p.name, q)}</b></span><span class="sg-pr${p.was ? ' sale' : ''}">${S.eur(p.price)}</span></a>`).join('');
        if (!cats.length && !prods.length) html += `<div class="sg-none">Geen directe treffers hier. De webshop zoekt verder.</div>`;
        html += `<a role="option" class="sg-all" href="${S.SHOP.search + encodeURIComponent(raw)}">${ui('search')}<span>Zoek “${esc(raw)}” in de hele webshop</span>${ui('arrow')}</a>`;
      }
      box.innerHTML = html;
      opts = [...box.querySelectorAll('[role=option]')];
      opts.forEach((o, i) => { o.id = 'sg-' + i; o.tabIndex = -1; });
      act = -1; inp.removeAttribute('aria-activedescendant');
      open(true);
    }
    function open(on) { box.hidden = !on; inp.setAttribute('aria-expanded', on); form.classList.toggle('open', on); }
    function move(d) {
      if (!opts.length) return;
      act = (act + d + opts.length) % opts.length;
      opts.forEach((o, i) => o.setAttribute('aria-selected', i === act));
      inp.setAttribute('aria-activedescendant', opts[act].id);
      opts[act].scrollIntoView({ block: 'nearest' });
    }
    inp.addEventListener('input', render);
    inp.addEventListener('focus', render);
    inp.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); if (box.hidden) render(); move(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
      else if (e.key === 'Enter' && act >= 0) { e.preventDefault(); opts[act].click(); }
      else if (e.key === 'Escape') { e.preventDefault(); open(false); }
    });
    document.addEventListener('pointerdown', e => { if (!form.contains(e.target)) open(false); });
    form.addEventListener('focusout', () => setTimeout(() => { if (!form.contains(document.activeElement)) open(false); }, 0));
    // "/" focuses the search, like most shops.
    document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); inp.focus(); } });
  }
  function mount(map) { for (const k in map) document.querySelectorAll(`[data-ui="${k}"]`).forEach(el => el.outerHTML = map[k]); wire(); search(); }

  window.UI = { ui, ic, photo, header, card, grid, secHead, cats, chips, usp, customizer, club, brands, showroom, footer, mount, nav };
})();

</script>
<script>
const S = SSK, U = UI, P = S.PRODUCTS;
U.mount({ header: U.header({ light: true, topbar: false }), customizer: U.customizer({ title: 'Jouw handschoen, jouw ontwerp' }), club: U.club(), brands: U.brands(), showroom: U.showroom(), footer: U.footer() });
document.getElementById('cz1').href = S.CUSTOMIZER_URL;
document.getElementById('shop1').href = U.nav('Handschoenen').url;
const T = [['New arrivals', P.gloves, 'New Arrivals'], ['Ballen', P.balls, 'Ballen'], ['Outlet', P.outlet, 'Outlet']];
const box = document.getElementById('s-tabs');
box.innerHTML = `<div class="tabs" role="tablist">${T.map((t, i) => `<button role="tab" aria-selected="${i === 0}" data-i="${i}">${t[0]}</button>`).join('')}</div><div id="tabp"></div><div style="margin-top:24px;text-align:center"><a class="link" id="tabl"></a></div>`;
function show(i) {
  box.querySelectorAll('.tabs button').forEach((b, j) => b.setAttribute('aria-selected', i === j));
  document.getElementById('tabp').innerHTML = U.grid(T[i][1]);
  const l = document.getElementById('tabl'); l.href = U.nav(T[i][2]).url; l.innerHTML = `Bekijk alle ${T[i][0].toLowerCase()} ${U.ui('arrow')}`;
}
box.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); });
show(0);
document.getElementById('cats2').innerHTML = S.NAV.map(n => `<a href="${n.url}">${U.ic(n.icon)}${n.name}${U.ui('arrow')}</a>`).join('');
</script>
