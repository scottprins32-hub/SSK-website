<style>
.hero{padding:48px 0}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center}
.hero .d-xl{margin:12px 0 16px}
.hero .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.feat{display:block;overflow:hidden}
.feat .ph{position:relative;aspect-ratio:16/11;background:#fff;border-bottom:1px solid var(--g100)}
.feat .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:16px;background:#fff}
.feat .ph .badge{position:absolute;top:16px;left:16px;z-index:2}
.feat .row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px}
.feat .row b{font-family:var(--mono);font-size:18px;color:var(--navy-900);white-space:nowrap}
.cz-wrap .stitch{margin-bottom:24px}

</style>
</head>
<body>
<div data-ui="header"></div>
<main>
  <section class="hero"><div class="wrap">
    <div>
      <div class="kick">Honkbal en softbal</div>
      <h1 class="d-xl">Uitrusting voor elke positie</h1>
      <p class="lead">Handschoenen, knuppels, ballen, helmen, catcher gear en clubkleding van SSK, Rawlings, Wilson, Easton en meer. Online te bestellen of te passen in onze showroom.</p>
      <div class="btns"><a class="btn btn-red" id="h-shop">Shop handschoenen</a><a class="btn btn-line" id="h-cz">Glove Customizer</a></div>
    </div>
    <a class="card lift feat" id="feat"></a>
  </div></section>
  <div data-ui="usp"></div>

  <section class="sec"><div class="wrap" id="s-cats"></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap" id="s-new"></div></section>
  <section class="sec tight cz-wrap"><div class="wrap"><div class="stitch"></div><div data-ui="customizer"></div></div></section>
  <section class="sec"><div class="wrap" id="s-balls"></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap" id="s-outlet"></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap"><div data-ui="club"></div></div></section>
  <section class="sec tight" style="padding-top:0"><div class="wrap"><div class="sec-h"><h2 class="d-md">Onze merken</h2></div><div data-ui="brands"></div></div></section>
  <section class="sec tight"><div class="wrap"><div data-ui="showroom"></div></div></section>
</main>
<div data-ui="footer"></div>
<script>
/*DATA*/
</script>
<script>
const S = SSK, U = UI, P = S.PRODUCTS, g = P.gloves[0];
U.mount({ header: U.header(), usp: U.usp(), customizer: U.customizer(), club: U.club(), brands: U.brands(), showroom: U.showroom(), footer: U.footer() });
document.getElementById('h-shop').href = U.nav('Handschoenen').url;
document.getElementById('h-cz').href = S.CUSTOMIZER_URL;
const f = document.getElementById('feat'); f.href = g.url;
f.innerHTML = `<div class="ph"><span class="badge b-new">Nieuw binnen</span>${U.photo(g.photo, 'Productfoto', 'glove')}</div>
  <div class="row"><span><span class="brand" style="font:700 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--g500)">${g.brand}</span><br><span style="font-weight:600;color:var(--g900)">${g.name}</span></span><b>${S.eur(g.price)}</b></div>`;
document.getElementById('s-cats').innerHTML = U.secHead('Assortiment', 'Shop per categorie', 'Alle categorieën', '#') +
  U.cats(['Handschoenen', 'Knuppels', 'Ballen', 'Helmen', 'Catcher', 'Slaghandschoenen', 'Schoenen', 'Kleding', 'Clubkleding', 'Tassen', 'Veld'], true);
document.getElementById('s-new').innerHTML = U.secHead('Net binnen', 'New arrivals', 'Bekijk alles', U.nav('New Arrivals').url) + U.grid(P.gloves);
document.getElementById('s-balls').innerHTML = U.secHead('Ballen', 'Honkballen en softballen', 'Alle ballen', U.nav('Ballen').url, 'Welke bal past bij jouw competitie? Lees onze uitleg in “Welke bal koopt u?”.') + U.grid(P.balls);
document.getElementById('s-outlet').innerHTML = U.secHead('Outlet', 'Tot 50% korting', 'Naar de outlet', U.nav('Outlet').url) + U.grid(P.outlet);
</script>
</body>
</html>
