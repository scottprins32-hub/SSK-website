name: Catalogue
# Refreshes the products, prices and photos of every category page from the live shop,
# rebuilds the pages and commits the result. Runs every Monday morning and on demand.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow rjsmin rcssmin
      - run: python scripts/fetch_catalog.py
      - run: python scripts/fetch_thumbs.py
      - run: python build.py
      - name: Commit changes
        run: |
          git add src/catalog assets/thumbs '*/index.html' index.html concepts
          if git diff --cached --quiet; then echo "Catalogue unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898333+github-actions[bot]@users.noreply.github.com" commit -m "Refresh the catalogue from the shop"
          git push
